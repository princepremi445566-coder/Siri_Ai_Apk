name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version 17 or higher is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified: Version $JAVA_MAJOR meets the requirement (17+)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists, skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore was not found after creation."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Expected APK file does not have .apk extension."; exit 1 ;;
          esac
          echo "APK successfully verified: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_FILE="$RELEASE_DIR/app-debug.apk"
          cp "$SOURCE_APK" "$RELEASE_FILE"
          if [ ! -f "$RELEASE_FILE" ] || [ ! -s "$RELEASE_FILE" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_FILE"
            exit 1
          fi
          echo "apk_path=$RELEASE_FILE" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at: $RELEASE_FILE"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared asset $ASSET_PATH not found."
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared asset $ASSET_PATH is empty."
            exit 1
          fi
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "Error: Prepared asset filename must be app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE=$(mktemp)
          {
            echo "### Automated Debug APK Build"
            echo ""
            echo "- **Type**: Automatically generated debug APK"
            echo "- **Builder**: GitHub Actions"
            echo "- **Run Number**: ${{ github.run_number }}"
            echo "- **Run Attempt**: ${{ github.run_attempt }}"
            echo "- **Commit SHA**: ${{ github.sha }}"
            echo "- **Usage**: Intended for testing only. Not a Play Store production release."
            echo "- **Signing**: Signed only with a temporary debug keystore."
          } > "$NOTES_FILE"

          echo "Publishing GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release Publication Succeeded!"
            gh release view "$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            echo "=========================================="

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release creation failed or was skipped."
            echo "The APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."
            echo "### DIRECT APK DOWNLOAD (PENDING)" >> "$GITHUB_STEP_SUMMARY"
            echo "> The Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          fi
